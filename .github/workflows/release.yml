name: 同步 GitHub Release 说明

on:
  workflow_call:

permissions:
  contents: write

jobs:
  release-notes:
    name: 同步版本说明
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 生成双语版本说明
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md

      - name: 创建或更新 GitHub Release（仅说明）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $OutputEncoding = [System.Text.Encoding]::UTF8
          $tags = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases" --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_NAME -in $tags) {
            gh release edit $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes-file release-notes.md
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title $env:GITHUB_REF_NAME --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
