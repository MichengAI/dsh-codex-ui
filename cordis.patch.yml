# 桌面端 0.2 的官方侧栏会声明同一批子插槽。两边同时登记会让本插件激活失败，
# 界面仍停在官方侧栏。启用时必须停用官方侧栏和设置壳，由本插件接管。
# 禁用或卸载后这些行随 bundle 一起失效，官方实现回来；列宽在客户端卸载时还原。
# 标题服务同时只接受一个提供方，所以仍停用官方 session-title-llm。
- id: ui-sidebar
  disabled: true
- id: ui-settings-general
  disabled: true
- id: session-title-llm
  disabled: true
- insert:
    - id: michengai-codex-ui-session-title
      name: '@michengai/dsh-codex-ui/session-title'
    - id: codex-ui
      name: '@michengai/dsh-codex-ui'
